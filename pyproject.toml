[project]
name = "asl-robustness"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "kaggle>=2.2.5",
    "keras>=3.15.1",
    "matplotlib>=3.11.2",
    "mediapipe>=1.2.2",
    "opencv-python-headless>=5.0.0.93",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "torch>=2.15.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.uv]
# mediapipe pulls opencv-contrib-python (needs libGL); keep only the headless build
override-dependencies = ["opencv-contrib-python; sys_platform == 'never'"]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
